# Data Contract conforme a l'Open Data Contract Standard (ODCS) v3 - Bitol / Linux Foundation
apiVersion: v3.0.2
kind: DataContract
id: urn:datacontract:import-distribution:stocks-quotidiens
name: Stocks quotidiens par depot
version: 2.0.0
status: active
domain: import-distribution
tenant: import-distribution-madagascar
dataProduct: stocks-quotidiens

description:
  purpose: >
    Photo quotidienne des stocks disponibles et reserves par reference produit
    (consoles et gaming, audio, telephonie, montres connectees, eclairage LED,
    electromenager) et par depot : depot central Ankorondrano, boutiques
    Analakely et Behoririka, depot regional de Tamatave. Sert au pilotage des
    ruptures, au calcul de couverture et aux decisions de reassort import.
  usage: >
    Alertes de rupture sur les produits a forte rotation, calcul de la
    couverture de stock en jours, arbitrage des transferts entre depots,
    declenchement des commandes de reapprovisionnement aupres des fournisseurs
    de Shenzhen, Guangzhou, Yiwu, Dongguan et Dubai.
  limitations: >
    Granularite journaliere uniquement. Les mouvements intra-journaliers et
    les marchandises en cours de dedouanement ne figurent pas dans ce flux.

schema:
  - name: stocks_quotidiens
    physicalName: stocks_quotidiens.csv
    logicalType: object
    physicalType: csv
    description: Une ligne par jour, par reference produit et par depot.
    quality:
      - type: library
        rule: uniqueCombination
        description: Unicite de la combinaison date, reference et depot.
        columns: [date_stock, sku, depot_id]
    properties:
      - name: date_stock
        logicalType: date
        physicalType: string
        required: true
        description: Date de la photo de stock (fuseau Indian/Antananarivo).
      - name: sku
        logicalType: string
        physicalType: string
        required: true
        description: Reference produit interne, prefixee par la famille.
        quality:
          - type: library
            rule: pattern
            description: Format CON/AUD/TEL/MON/LED/ELM suivi de 5 chiffres.
            pattern: "^(CON|AUD|TEL|MON|LED|ELM)-[0-9]{5}$"
      - name: depot_id
        logicalType: string
        physicalType: string
        required: true
        description: >
          Identifiant du depot. DEP-001 Ankorondrano (central), DEP-002
          Analakely, DEP-003 Behoririka, DEP-004 Tamatave.
        quality:
          - type: library
            rule: pattern
            description: Format DEP suivi de 3 chiffres.
            pattern: "^DEP-[0-9]{3}$"
      - name: type_depot
        logicalType: string
        physicalType: string
        required: true
        description: Nature du site de stockage dans le reseau de distribution.
        quality:
          - type: library
            rule: validValues
            description: Valeurs autorisees pour le type de depot.
            validValues: [central, boutique, depot_regional]
      - name: quantite_disponible
        logicalType: integer
        physicalType: integer
        required: true
        description: Quantite vendable immediatement, jamais negative.
        quality:
          - type: library
            rule: range
            description: Quantite disponible entre 0 et 100000.
            mustBeGreaterOrEqualTo: 0
            mustBeLessOrEqualTo: 100000
      - name: quantite_reservee
        logicalType: integer
        physicalType: integer
        required: true
        description: Quantite reservee par des commandes clients ou des transferts.
        quality:
          - type: library
            rule: range
            description: Quantite reservee entre 0 et 100000.
            mustBeGreaterOrEqualTo: 0
            mustBeLessOrEqualTo: 100000
      - name: horodatage_maj
        logicalType: timestamp
        physicalType: string
        required: true
        description: Horodatage de calcul de la ligne par la plateforme data.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    description: Publication une fois par jour avant 07h00, heure d'Antananarivo.
  - property: freshness
    value: 24
    unit: h
    element: stocks_quotidiens.horodatage_maj
    description: Aucune ligne ne doit avoir plus de 24 heures.
  - property: completeness
    value: 99.0
    unit: percent
    description: Taux global de cellules renseignees superieur ou egal a 99 pour cent.
  - property: availability
    value: 99.5
    unit: percent
    description: Disponibilite du data product sur le mois glissant.

support:
  - channel: "#data-import-mada"
    tool: slack
    scope: interactive
  - channel: data-import@mada-electronique.example
    tool: email
    scope: issues

team:
  - username: h.andriamaholy
    role: owner
    dateIn: "2026-01-05"
  - username: equipe-data-depots
    role: steward

customProperties:
  - property: domaineMetier
    value: Import et distribution de produits electroniques a Madagascar
  - property: classificationDonnees
    value: interne
  - property: entrepotAnalytique
    value: supply-dbt-warehouse (dbt + DuckDB)
