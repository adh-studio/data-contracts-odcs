# Data Contract conforme a l'Open Data Contract Standard (ODCS) v3 - Bitol / Linux Foundation
apiVersion: v3.0.2
kind: DataContract
id: urn:datacontract:offre-supply:commandes-fournisseurs
name: Commandes fournisseurs
version: 1.1.0
status: active
domain: offre-supply
tenant: enseigne-decoration
dataProduct: commandes-fournisseurs

description:
  purpose: >
    Lignes de commandes passees aupres des fournisseurs de mobilier et de
    decoration (canapes, luminaires, vaisselle, tapis, rangement). Alimente le
    suivi des approvisionnements, les previsions de reception en entrepot et
    la mesure de la performance fournisseur.
  usage: >
    Suivi des delais de livraison, calcul du taux de service fournisseur,
    projection des entrees en stock.
  limitations: >
    Les avoirs et litiges ne transitent pas par ce flux.

schema:
  - name: commandes_fournisseurs
    physicalName: commandes_fournisseurs.csv
    logicalType: object
    physicalType: csv
    description: Une ligne par reference produit et par commande fournisseur.
    quality:
      - type: library
        rule: uniqueCombination
        description: Unicite de la combinaison commande et reference.
        columns: [commande_id, sku]
      - type: custom
        rule: ordreDates
        description: La date de livraison prevue est posterieure ou egale a la date de commande.
        customProperties:
          - property: colonneDebut
            value: date_commande
          - property: colonneFin
            value: date_livraison_prevue
    properties:
      - name: commande_id
        logicalType: string
        physicalType: string
        required: true
        description: Identifiant de la commande fournisseur.
        quality:
          - type: library
            rule: pattern
            description: Format CF suivi de l'annee et de 6 chiffres.
            pattern: "^CF-20[0-9]{2}-[0-9]{6}$"
      - name: fournisseur_id
        logicalType: string
        physicalType: string
        required: true
        description: Identifiant du fournisseur dans le referentiel achats.
        quality:
          - type: library
            rule: pattern
            description: Format FRN suivi de 4 chiffres.
            pattern: "^FRN-[0-9]{4}$"
      - name: sku
        logicalType: string
        physicalType: string
        required: true
        description: Reference produit commandee.
        quality:
          - type: library
            rule: pattern
            description: Format CAN/LUM/VAI/TAP/RAN suivi de 5 chiffres.
            pattern: "^(CAN|LUM|VAI|TAP|RAN)-[0-9]{5}$"
      - name: quantite_commandee
        logicalType: integer
        physicalType: integer
        required: true
        description: Quantite commandee, strictement positive.
        quality:
          - type: library
            rule: range
            description: Quantite entre 1 et 50000.
            mustBeGreaterOrEqualTo: 1
            mustBeLessOrEqualTo: 50000
      - name: prix_unitaire_eur
        logicalType: number
        physicalType: decimal
        required: true
        description: Prix d'achat unitaire negocie, en euros hors taxes.
        quality:
          - type: library
            rule: range
            description: Prix unitaire strictement positif et inferieur a 10000 euros.
            mustBeGreaterOrEqualTo: 0.01
            mustBeLessOrEqualTo: 10000
      - name: date_commande
        logicalType: date
        physicalType: string
        required: true
        description: Date d'emission de la commande.
      - name: date_livraison_prevue
        logicalType: date
        physicalType: string
        required: true
        description: Date de livraison contractuelle en entrepot.
      - name: statut
        logicalType: string
        physicalType: string
        required: true
        description: Etat de la ligne de commande dans le cycle achat.
        quality:
          - type: library
            rule: validValues
            description: Statuts autorises du cycle de vie.
            validValues: [brouillon, confirmee, expediee, recue, annulee]
      - name: horodatage_maj
        logicalType: timestamp
        physicalType: string
        required: true
        description: Horodatage de derniere mise a jour de la ligne.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    description: Publication quotidienne apres synchronisation de l'ERP achats.
  - property: freshness
    value: 48
    unit: h
    element: commandes_fournisseurs.horodatage_maj
    description: Aucune ligne ne doit avoir plus de 48 heures.
  - property: completeness
    value: 99.0
    unit: percent
    description: Taux global de cellules renseignees superieur ou egal a 99 pour cent.
  - property: availability
    value: 99.0
    unit: percent
    description: Disponibilite du data product sur le mois glissant.

support:
  - channel: "#data-offre-supply"
    tool: slack
    scope: interactive
  - channel: data-supply@enseigne-deco.example
    tool: email
    scope: issues

team:
  - username: h.andriamaholy
    role: owner
    dateIn: "2026-01-05"
  - username: equipe-achats-data
    role: steward

customProperties:
  - property: domaineMetier
    value: Offre et Supply
  - property: classificationDonnees
    value: confidentiel-achats
