# Data Contract conforme a l'Open Data Contract Standard (ODCS) v3 - Bitol / Linux Foundation
apiVersion: v3.0.2
kind: DataContract
id: urn:datacontract:import-distribution:referentiel-produits
name: Referentiel produits
version: 3.0.0
status: active
domain: import-distribution
tenant: import-distribution-madagascar
dataProduct: referentiel-produits

description:
  purpose: >
    Referentiel maitre des produits electroniques importes et distribues a
    Madagascar : consoles et gaming, audio, telephonie et accessoires, montres
    connectees, eclairage LED, electromenager. Source de verite pour les
    attributs commerciaux (prix d'achat et de vente en ariary) et le
    rattachement fournisseur, utilisee par tous les data products du domaine
    import-distribution.
  usage: >
    Jointures de reference pour les stocks des depots et les lots d'import,
    calcul de marge en MGA, etiquetage boutique, alimentation de l'entrepot
    analytique supply-dbt-warehouse.
  limitations: >
    Les prix promotionnels et les remises boutique ne figurent pas dans ce
    referentiel.

schema:
  - name: referentiel_produits
    physicalName: referentiel_produits.csv
    logicalType: object
    physicalType: csv
    description: Une ligne par reference produit active au catalogue.
    properties:
      - name: sku
        logicalType: string
        physicalType: string
        required: true
        unique: true
        description: Reference produit interne, cle primaire du referentiel.
        quality:
          - type: library
            rule: pattern
            description: Format CON/AUD/TEL/MON/LED/ELM suivi de 5 chiffres.
            pattern: "^(CON|AUD|TEL|MON|LED|ELM)-[0-9]{5}$"
      - name: nom
        logicalType: string
        physicalType: string
        required: true
        description: Nom commercial du produit en francais.
      - name: famille
        logicalType: string
        physicalType: string
        required: true
        description: Famille marchandise de rattachement.
        quality:
          - type: library
            rule: validValues
            description: Les six familles du catalogue electronique.
            validValues: [consoles_gaming, audio, telephonie_accessoires,
                          montres_connectees, eclairage_led, electromenager]
      - name: prix_achat_mga
        logicalType: integer
        physicalType: integer
        required: true
        description: Prix d'achat fournisseur de reference, en ariary malgaches (MGA).
        quality:
          - type: library
            rule: range
            description: Prix d'achat entre 1000 et 10000000 d'ariary.
            mustBeGreaterOrEqualTo: 1000
            mustBeLessOrEqualTo: 10000000
      - name: prix_vente_mga
        logicalType: integer
        physicalType: integer
        required: true
        description: Prix de vente conseille en boutique, en ariary malgaches (MGA).
        quality:
          - type: library
            rule: range
            description: Prix de vente entre 1000 et 20000000 d'ariary.
            mustBeGreaterOrEqualTo: 1000
            mustBeLessOrEqualTo: 20000000
      - name: fournisseur_id
        logicalType: string
        physicalType: string
        required: true
        description: >
          Fournisseur principal de la reference (Shenzhen, Guangzhou, Yiwu,
          Dongguan ou Dubai), cle vers le referentiel achats.
        quality:
          - type: library
            rule: pattern
            description: Format FRN suivi de 4 chiffres.
            pattern: "^FRN-[0-9]{4}$"
      - name: date_maj
        logicalType: timestamp
        physicalType: string
        required: true
        description: Horodatage de derniere mise a jour de la fiche produit.

slaProperties:
  - property: frequency
    value: 7
    unit: d
    description: Publication hebdomadaire apres revue du catalogue import.
  - property: freshness
    value: 168
    unit: h
    element: referentiel_produits.date_maj
    description: Toute fiche produit doit avoir ete revalidee depuis moins de 7 jours.
  - property: completeness
    value: 100.0
    unit: percent
    description: Referentiel maitre, aucune cellule vide toleree.
  - property: availability
    value: 99.9
    unit: percent
    description: Disponibilite du data product sur le mois glissant.

support:
  - channel: "#data-import-mada"
    tool: slack
    scope: interactive
  - channel: data-import@mada-electronique.example
    tool: email
    scope: issues

team:
  - username: h.andriamaholy
    role: owner
    dateIn: "2026-01-05"
  - username: equipe-referentiels
    role: steward

customProperties:
  - property: domaineMetier
    value: Import et distribution de produits electroniques a Madagascar
  - property: classificationDonnees
    value: interne
  - property: entrepotAnalytique
    value: supply-dbt-warehouse (dbt + DuckDB)
