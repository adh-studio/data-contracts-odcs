name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generation des jeux de donnees synthetiques
        run: python scripts/genere_donnees.py

      - name: Tests e2e (pytest)
        run: PYTHONPATH=src python -m pytest tests/ -v

      - name: Regeneration du rapport de conformite
        run: python scripts/genere_rapport.py

      - name: Publication du rapport en artefact
        uses: actions/upload-artifact@v4
        with:
          name: rapport-conformite
          path: docs/index.html
